name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"  # weekly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest
            os: ubuntu-22.04
            python: "3.7"
            perl: "5.24"
            # perl 5.24 links -lnsl
            apt: libnsl-dev
          - name: distro
            os: ubuntu-24.04
            system: apt
          - name: rhel8
            os: ubuntu-24.04
            container: rockylinux:8
            system: dnf
          - name: newest
            os: ubuntu-26.04
            python: "3.15"
            perl: "5.44"
            threads: true
            no_multi_perl: true
          - name: newest MULTI_PERL
            os: ubuntu-26.04
            python: "3.15"
            perl: "5.44"
            threads: true
            multi_perl: true
          - name: arm64 (optional)
            os: ubuntu-26.04-arm
            python: "3.15"
            perl: "5.44"
            threads: true
            optional: true
          - name: free-threaded (optional)
            os: ubuntu-26.04
            python: "3.15t"
            perl: "5.44"
            threads: true
            optional: true
          - name: macOS (optional)
            os: macos-latest
            python: "3.15"
            perl: "5.44"
            optional: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        if: ${{ !matrix.system }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Perl ${{ matrix.perl }}
        if: ${{ !matrix.system }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          multi-thread: ${{ matrix.threads == true }}

      - name: Install extra packages
        if: ${{ matrix.apt }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Install distro Python and Perl development packages
        if: ${{ matrix.system == 'apt' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dev python3-venv libperl-dev

      - name: Install RHEL Python and Perl development packages
        if: ${{ matrix.system == 'dnf' }}
        run: dnf install -y python36 python36-devel perl perl-devel perl-ExtUtils-Embed gcc make redhat-rpm-config

      - name: Create virtualenv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          python -VV
          perl -V:version -V:useithreads -V:useshrplib -V:installvendorarch
          cc --version | head -1

      - name: Disable MULTI_PERL
        if: ${{ matrix.no_multi_perl }}
        run: rm -f MULTI_PERL

      - name: Build
        run: python setup.py build

      - name: Test
        run: |
          export PYTHONPATH="$(ls -d "$PWD"/build/lib.*)"
          python -c "import perl; print('MULTI_PERL =', perl.MULTI_PERL)"
          python -m unittest discover -s tests -p '*.py' -v
          python test.py

      - name: Refuse to run with the GIL forced off
        if: ${{ endsWith(matrix.python, 't') }}
        run: |
          export PYTHONPATH="$(ls -d "$PWD"/build/lib.*)"
          PYTHON_GIL=0 python -c 'import perl' 2>&1 | grep "perl needs the GIL"

      - name: pip install and test the installed copy
        run: |
          pip install .
          cd "$RUNNER_TEMP"
          python -c 'import perl; assert perl.eval("3+3") == 6; print("pyperl OK with perl", perl.eval("sprintf q{%vd}, $^V"))'
          cd "$GITHUB_WORKSPACE"
          python -m unittest discover -s tests -p '*.py'
          python test.py
